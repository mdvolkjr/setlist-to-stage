<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Setlist Book — My Bands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
<style>




















  .wrap { max-width: 940px; margin: 0 auto; padding: 34px 18px 90px; }
  header.page-head { text-align: center; margin-bottom: 28px; }
  header.page-head .ornament { color: var(--tan); font-size: 1.1rem; letter-spacing: 0.3em; margin-bottom: 6px; }
  header.page-head h1 { font-family: var(--font-display); font-weight: 600; color: var(--brown); font-size: clamp(1.8rem,4vw,2.6rem); letter-spacing: 0.03em; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
  header.page-head .subtitle { font-family: var(--font-display); font-style: italic; color: var(--faded); margin-top: 5px; }

  .band-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 16px; margin-bottom: 26px; }
  .band-card {
    display: block; text-decoration: none; background: var(--parchment);
    border: 1px solid var(--tan); border-radius: 9px; padding: 18px 18px 16px;
    box-shadow: 2px 3px 12px rgba(74,46,26,0.1); transition: transform 0.12s, box-shadow 0.15s;
    position: relative;
  }
  .band-card:hover { transform: translateY(-2px); box-shadow: 3px 5px 16px rgba(74,46,26,0.2); }
  .band-card .bc-name { font-family: var(--font-display); font-weight: 700; color: var(--brown); font-size: 1.25rem; line-height: 1.15; margin-bottom: 6px; }
  .band-card .bc-desc { font-size: 0.82rem; color: var(--faded); font-style: italic; margin-bottom: 12px; min-height: 1.1em; }
  .band-card .bc-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .bc-chip {
    font-family: var(--font-label); font-size: 0.62rem; letter-spacing: 0.06em;
    padding: 3px 9px; border-radius: 10px; background: rgba(139,58,26,0.12);
    color: var(--rust); border: 1px solid rgba(139,58,26,0.25);
  }
  .bc-chip.role { background: rgba(58,107,58,0.12); color: var(--green); border-color: rgba(58,107,58,0.3); }

  .create-card {
    background: rgba(74,46,26,0.05); border: 1px dashed var(--tan); border-radius: 9px;
    padding: 18px; text-align: center;
  }
  .create-form { display: none; max-width: 460px; margin: 0 auto; text-align: left; }
  .create-form.show { display: block; }
  .create-card .add-band-btn.hidden { display: none; }
  .add-band-btn {
    font-family: var(--font-label); font-size: 0.8rem; letter-spacing: 0.06em;
    background: var(--rust); color: var(--cream); border: none; border-radius: 7px;
    padding: 12px 24px; cursor: pointer; text-transform: uppercase; transition: background 0.15s;
  }
  .add-band-btn:hover { background: #a04020; }
  .field { margin-bottom: 12px; }




  .form-btns { display: flex; gap: 8px; margin-top: 4px; }








  @media (max-width: 620px) { .user-chip .uname { display: none; } }
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html">The Setlist Book<small>Rehearsal → Stage</small></a>
  <nav class="mainnav">
    <a class="navlink" href="index.html">🏠 Dashboard</a>
    <a class="navlink" href="library.html">📚 Library</a>
    <a class="navlink active" href="bands.html">🎸 Bands</a>
  </nav>
  <div class="topbar-spacer"></div>
  <a class="user-chip" id="userChip" href="profile.html" title="Your profile & settings"></a>
  <button class="btn ghost" id="signoutBtn" style="display:none">Sign out</button>
</div>

<div id="gate" class="gate" style="display:none">
  <h2>Please sign in</h2>
  <p>Open the <a href="library.html">library</a> and sign in with Google to manage your bands.</p>
</div>

<div class="loading" id="loading">Loading…</div>

<div class="wrap" id="content" style="display:none">
  <header class="page-head">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>My Bands</h1>
    <p class="subtitle">Every project you play in</p>
  </header>

  <div class="band-grid" id="bandGrid"></div>

  <div class="create-card">
    <button class="add-band-btn" id="showCreateBtn">＋ Create a Band</button>
    <div class="create-form" id="createForm">
      <div class="field">
        <label class="field-label">Band Name</label>
        <input class="text-input" id="bandName" type="text" placeholder="e.g. The Tumbleweeds" maxlength="80">
      </div>
      <div class="field">
        <label class="field-label">Your Role in this Band <span style="text-transform:none;font-style:italic;opacity:0.7">(optional)</span></label>
        <input class="text-input" id="bandRole" type="text" placeholder="e.g. Lead guitar & vocals" maxlength="80">
      </div>
      <div class="field">
        <label class="field-label">Description <span style="text-transform:none;font-style:italic;opacity:0.7">(optional)</span></label>
        <input class="text-input" id="bandDesc" type="text" placeholder="e.g. Country rock 4-piece, weekend gigs" maxlength="140">
      </div>
      <div class="form-btns">
        <button class="btn" id="createBtn">Create Band</button>
        <button class="btn ghost" id="cancelCreateBtn">Cancel</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { auth, db } from './firebase-init.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, where, orderBy, onSnapshot, addDoc, serverTimestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const $ = id => document.getElementById(id);
let user = null;
let bandsUnsub = null;

const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 1700); }

$('signoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, u => {
  user = u;
  if (bandsUnsub) { bandsUnsub(); bandsUnsub = null; }
  if (!u) {
    $('gate').style.display = 'block';
    $('loading').style.display = 'none';
    $('content').style.display = 'none';
    $('userChip').innerHTML = '';
    $('signoutBtn').style.display = 'none';
    return;
  }
  $('gate').style.display = 'none';
  $('signoutBtn').style.display = '';
  $('userChip').innerHTML = `${u.photoURL ? `<img src="${esc(u.photoURL)}" alt="">` : ''}<span class="uname">${esc(u.displayName || u.email)}</span>`;

  bandsUnsub = onSnapshot(
    query(collection(db, 'bands'), where('memberUids', 'array-contains', u.uid)),
    snap => {
      const bands = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      bands.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
      renderBands(bands);
      $('loading').style.display = 'none';
      $('content').style.display = 'block';
    },
    err => { $('loading').textContent = 'Could not load bands: ' + err.message; }
  );
});

function renderBands(bands) {
  const grid = $('bandGrid');
  grid.innerHTML = '';
  if (!bands.length) {
    const e = document.createElement('div');
    e.className = 'empty-state';
    e.style.gridColumn = '1 / -1';
    e.innerHTML = `<div class="big">🎸</div><p>You're not in any bands yet.<br>Create your first one below.</p>`;
    grid.appendChild(e);
    return;
  }
  bands.forEach(b => {
    const members = b.memberUids ? b.memberUids.length : 1;
    const myRole = (b.members && user && b.members[user.uid] && b.members[user.uid].role) || '';
    const a = document.createElement('a');
    a.className = 'band-card';
    a.href = 'band.html?id=' + encodeURIComponent(b.id);
    a.innerHTML = `
      <div class="bc-name">${esc(b.name || 'Untitled band')}</div>
      <div class="bc-desc">${esc(b.description || '')}</div>
      <div class="bc-meta">
        <span class="bc-chip">${members} member${members === 1 ? '' : 's'}</span>
        ${myRole ? `<span class="bc-chip role">${esc(myRole)}</span>` : ''}
      </div>`;
    grid.appendChild(a);
  });
}

// ── Create band ──
$('showCreateBtn').addEventListener('click', () => {
  $('createForm').classList.add('show');
  $('showCreateBtn').classList.add('hidden');
  $('bandName').focus();
});
$('cancelCreateBtn').addEventListener('click', resetCreate);
function resetCreate() {
  $('createForm').classList.remove('show');
  $('showCreateBtn').classList.remove('hidden');
  $('bandName').value = ''; $('bandRole').value = ''; $('bandDesc').value = '';
}

$('bandName').addEventListener('keydown', e => { if (e.key === 'Enter') createBand(); });
$('createBtn').addEventListener('click', createBand);

async function createBand() {
  if (!user) return;
  const name = $('bandName').value.trim();
  if (!name) { toast('Give your band a name'); $('bandName').focus(); return; }
  const role = $('bandRole').value.trim();
  const desc = $('bandDesc').value.trim();
  try {
    const ref = await addDoc(collection(db, 'bands'), {
      name,
      description: desc,
      createdBy: user.uid,
      memberUids: [user.uid],
      members: { [user.uid]: { name: user.displayName || user.email || '', role } },
      createdAt: serverTimestamp(),
      updatedAt: serverTimestamp()
    });
    resetCreate();
    toast('Band created');
    location.href = 'band.html?id=' + encodeURIComponent(ref.id);
  } catch (e) {
    toast('Could not create band: ' + (e.code || e.message));
  }
}
</script>
</body>
</html>
