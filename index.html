<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Setlist Book — My Library</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Libre+Baskerville:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f5efe0; --parchment: #e8dcc8; --brown: #4a2e1a;
    --rust: #8b3a1a; --tan: #c8a97a; --ink: #2a1a0e;
    --faded: #7a6248; --line: #c4b08a; --green: #3a6b3a;
  }
  body {
    background-color: var(--cream);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(196,176,138,0.22) 27px, rgba(196,176,138,0.22) 28px);
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--ink); min-height: 100vh;
  }

  /* ── Top bar ── */
  .topbar {
    background: var(--brown); padding: 12px 22px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    position: sticky; top: 0; z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .brand { font-family: 'Special Elite', cursive; color: var(--cream); font-size: 1rem; letter-spacing: 0.08em; text-decoration: none; }
  .brand small { color: var(--tan); font-size: 0.62rem; letter-spacing: 0.15em; display: block; opacity: 0.7; }
  .topbar-spacer { flex: 1; }

  /* ── Primary nav ── */
  .mainnav { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }
  .navlink {
    font-family: 'Special Elite', cursive; font-size: 0.74rem; letter-spacing: 0.05em;
    color: var(--tan); text-decoration: none; padding: 7px 11px; border-radius: 3px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background 0.15s, color 0.15s;
  }
  .navlink:hover { background: rgba(255,255,255,0.09); color: var(--cream); }
  .navlink.active {
    background: rgba(139,58,26,0.45); color: var(--cream);
    box-shadow: inset 0 0 0 1px rgba(200,169,122,0.3);
  }
  .user-chip { display: flex; align-items: center; gap: 9px; text-decoration: none; padding: 3px 8px 3px 3px; border-radius: 20px; transition: background 0.15s; }
  .user-chip:hover { background: rgba(255,255,255,0.09); }
  .user-chip img { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--tan); }
  .user-chip .uname { color: var(--cream); font-size: 0.8rem; }
  .btn {
    font-family: 'Special Elite', cursive; font-size: 0.72rem; letter-spacing: 0.08em;
    background: var(--rust); color: var(--cream); border: none; border-radius: 3px;
    padding: 7px 14px; cursor: pointer; transition: background 0.15s; text-decoration: none;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { background: #a04020; }
  .btn.ghost { background: rgba(255,255,255,0.08); border: 1px solid rgba(200,169,122,0.3); color: var(--tan); }
  .btn.ghost:hover { background: rgba(255,255,255,0.15); }

  /* ── Sign-in screen ── */
  .signin-screen {
    display: none; position: fixed; inset: 0; z-index: 200;
    background: linear-gradient(135deg, var(--brown), #2a1707);
    align-items: center; justify-content: center; text-align: center; padding: 24px;
  }
  .signin-screen.show { display: flex; }
  .signin-card { max-width: 420px; }
  .signin-card .ornament { color: var(--tan); font-size: 1.4rem; letter-spacing: 0.4em; margin-bottom: 14px; }
  .signin-card h1 { font-family: 'Special Elite', cursive; color: var(--cream); font-size: 2.2rem; letter-spacing: 0.03em; }
  .signin-card p { color: var(--tan); font-family: 'Playfair Display', serif; font-style: italic; margin: 12px 0 30px; }
  .google-btn {
    display: inline-flex; align-items: center; gap: 12px; cursor: pointer;
    background: var(--cream); color: var(--ink); border: none; border-radius: 4px;
    padding: 13px 24px; font-family: 'Special Elite', cursive; font-size: 0.9rem;
    letter-spacing: 0.05em; transition: transform 0.12s, box-shadow 0.15s;
    box-shadow: 2px 3px 12px rgba(0,0,0,0.35);
  }
  .google-btn:hover { transform: scale(1.03); }
  .google-btn svg { width: 20px; height: 20px; }

  /* ── Main ── */
  .wrap { max-width: 1000px; margin: 0 auto; padding: 34px 18px 90px; }
  header.page-head { text-align: center; margin-bottom: 30px; }
  header.page-head .ornament { color: var(--tan); font-size: 1.1rem; letter-spacing: 0.3em; margin-bottom: 6px; }
  header.page-head h1 { font-family: 'Special Elite', cursive; color: var(--brown); font-size: clamp(1.8rem,4vw,2.8rem); letter-spacing: 0.03em; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
  header.page-head .subtitle { font-family: 'Playfair Display', serif; font-style: italic; color: var(--faded); margin-top: 5px; }

  /* ── Add / search bar ── */
  .add-bar { position: relative; max-width: 620px; margin: 0 auto 34px; }
  .add-bar-input-row { display: flex; gap: 8px; }
  .add-bar input {
    flex: 1; background: var(--parchment); border: 1px solid var(--tan);
    border-radius: 4px; padding: 12px 14px; font-family: 'Libre Baskerville', serif;
    font-size: 0.9rem; color: var(--ink); outline: none;
  }
  .add-bar input:focus { border-color: var(--rust); background: #fff; }
  .add-bar input::placeholder { color: var(--tan); font-style: italic; }
  .suggest-box {
    position: absolute; left: 0; right: 0; top: calc(100% + 4px);
    background: var(--cream); border: 1px solid var(--tan); border-radius: 4px;
    box-shadow: 2px 4px 16px rgba(74,46,26,0.25); z-index: 40; overflow: hidden;
    display: none;
  }
  .suggest-box.show { display: block; }
  .suggest-item { display: flex; align-items: center; gap: 11px; padding: 9px 13px; cursor: pointer; border-bottom: 1px solid rgba(196,176,138,0.4); }
  .suggest-item:last-child { border-bottom: none; }
  .suggest-item:hover, .suggest-item.active { background: rgba(200,169,122,0.22); }
  .suggest-item img { width: 34px; height: 34px; border-radius: 3px; flex-shrink: 0; background: var(--parchment); }
  .suggest-item .s-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--brown); font-size: 0.85rem; }
  .suggest-item .s-artist { font-size: 0.72rem; color: var(--faded); font-style: italic; }
  .suggest-item.manual { font-family: 'Special Elite', cursive; font-size: 0.75rem; color: var(--rust); letter-spacing: 0.05em; }

  /* ── Sections ── */
  .lib-section { margin-bottom: 40px; }
  .section-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; padding-bottom: 8px; border-bottom: 2px solid var(--line); }
  .section-head h2 { font-family: 'Special Elite', cursive; color: var(--brown); font-size: 1.05rem; letter-spacing: 0.06em; }
  .section-head .count { font-family: 'Special Elite', cursive; color: var(--faded); font-size: 0.75rem; opacity: 0.75; }
  .section-head .badge { font-family: 'Special Elite', cursive; font-size: 0.62rem; letter-spacing: 0.08em; padding: 2px 9px; border-radius: 10px; }
  .badge.learning { background: rgba(139,58,26,0.15); color: var(--rust); border: 1px solid rgba(139,58,26,0.3); }
  .badge.learned  { background: rgba(58,107,58,0.15); color: var(--green); border: 1px solid rgba(58,107,58,0.35); }

  .song-list { display: flex; flex-direction: column; gap: 8px; }
  .song-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--parchment); border: 1px solid var(--line); border-radius: 3px;
    padding: 10px 12px; transition: background 0.15s, box-shadow 0.15s;
  }
  .song-row:hover { box-shadow: 1px 2px 8px rgba(74,46,26,0.12); }
  .learn-toggle {
    flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
    border: 2px solid var(--tan); background: rgba(255,255,255,0.5); cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 12px; color: white;
    transition: background 0.15s, border-color 0.15s;
  }
  .learn-toggle.done { background: var(--green); border-color: var(--green); }
  .learn-toggle:hover { border-color: var(--green); }

  .song-main { flex: 1; min-width: 0; }
  .song-title { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--brown); font-size: 0.95rem; line-height: 1.2; }
  .song-artist { font-size: 0.76rem; color: var(--faded); font-style: italic; }
  .song-row.done .song-title { color: var(--faded); }

  .key-input {
    width: 48px; flex-shrink: 0; text-align: center; background: rgba(255,255,255,0.6);
    border: 1px solid var(--line); border-radius: 3px; padding: 5px 3px;
    font-family: 'Special Elite', cursive; font-size: 0.8rem; color: var(--ink); outline: none;
  }
  .key-input:focus { border-color: var(--rust); background: #fff; }
  .key-input::placeholder { color: var(--tan); }

  .link-icons { display: flex; gap: 5px; flex-shrink: 0; }
  .lnk {
    width: 27px; height: 27px; border-radius: 3px; display: flex; align-items: center; justify-content: center;
    font-size: 12px; text-decoration: none; border: 1px solid transparent; cursor: pointer;
  }
  .lnk.yt { background: rgba(139,58,26,0.12); color: var(--rust); }
  .lnk.yt:hover { background: var(--rust); color: white; }
  .lnk.sp { background: rgba(58,107,58,0.12); color: var(--green); }
  .lnk.sp:hover { background: var(--green); color: white; }
  .lnk.ap { background: rgba(74,46,26,0.1); color: var(--brown); }
  .lnk.ap:hover { background: var(--brown); color: white; }

  .row-actions { display: flex; gap: 5px; flex-shrink: 0; }
  .icon-btn {
    width: 29px; height: 28px; border-radius: 3px; border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; font-size: 13px; text-decoration: none;
  }
  .icon-btn.detail { background: var(--brown); color: var(--cream); }
  .icon-btn.detail:hover { background: var(--rust); }
  .icon-btn.del { background: rgba(139,58,26,0.1); color: var(--rust); border: 1px solid rgba(139,58,26,0.2); }
  .icon-btn.del:hover { background: var(--rust); color: white; }

  .empty-state { text-align: center; color: var(--faded); padding: 30px 10px; }
  .empty-state .big { font-size: 2rem; opacity: 0.4; margin-bottom: 8px; }
  .empty-state p { font-family: 'Playfair Display', serif; font-style: italic; margin-bottom: 16px; }

  .loading { text-align: center; color: var(--faded); padding: 50px; font-family: 'Special Elite', cursive; letter-spacing: 0.1em; }

  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--brown); color: var(--cream); font-family: 'Special Elite', cursive;
    font-size: 0.78rem; letter-spacing: 0.06em; padding: 10px 20px; border-radius: 4px;
    box-shadow: 2px 3px 12px rgba(0,0,0,0.3); opacity: 0; pointer-events: none;
    transition: opacity 0.25s, transform 0.25s; z-index: 300;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 620px) {
    .song-artist { display: none; }
    .link-icons .lnk.ap { display: none; }
    .user-chip .uname { display: none; }
  }
</style>
</head>
<body>

<!-- Sign-in overlay -->
<div class="signin-screen" id="signinScreen">
  <div class="signin-card">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>The Setlist Book</h1>
    <p>Your songs, your keys, your stage — everywhere you go.</p>
    <button class="google-btn" id="googleBtn">
      <svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- App -->
<div class="topbar">
  <a class="brand" href="index.html">The Setlist Book<small>Rehearsal → Stage</small></a>
  <nav class="mainnav">
    <a class="navlink active" href="index.html">📚 Library</a>
    <a class="navlink" href="bands.html">🎸 Bands</a>
  </nav>
  <div class="topbar-spacer"></div>
  <a class="user-chip" id="userChip" href="profile.html" title="Your profile & settings"></a>
  <button class="btn ghost" id="signoutBtn" style="display:none">Sign out</button>
</div>

<div class="wrap" id="appWrap" style="display:none">
  <header class="page-head">
    <div class="ornament">✦ ✦ ✦</div>
    <h1>My Song Library</h1>
    <p class="subtitle">Learn it · Know it · Play it</p>
  </header>

  <!-- Add / search -->
  <div class="add-bar">
    <div class="add-bar-input-row">
      <input type="text" id="songSearch" placeholder="Add a song — type a title to search…" autocomplete="off">
    </div>
    <div class="suggest-box" id="suggestBox"></div>
  </div>

  <!-- Learning -->
  <div class="lib-section">
    <div class="section-head">
      <h2>Learning</h2>
      <span class="badge learning">Practice</span>
      <span class="count" id="learningCount"></span>
    </div>
    <div class="song-list" id="learningList"></div>
  </div>

  <!-- Repertoire -->
  <div class="lib-section">
    <div class="section-head">
      <h2>Repertoire</h2>
      <span class="badge learned">Know it well</span>
      <span class="count" id="learnedCount"></span>
    </div>
    <div class="song-list" id="learnedList"></div>
  </div>
</div>

<div class="loading" id="loading">Loading…</div>
<div class="toast" id="toast"></div>

<script type="module">
import { auth, db, googleProvider } from './firebase-init.js';
import { onAuthStateChanged, signInWithPopup, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { collection, query, orderBy, onSnapshot, addDoc, updateDoc, deleteDoc, doc,
         serverTimestamp, getDocs, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

let currentUser = null;
let songsUnsub  = null;
let songsCache  = [];

// ── Utilities ──
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1800);
}
function songsCol() { return collection(db, 'users', currentUser.uid, 'songs'); }
function songDoc(id) { return doc(db, 'users', currentUser.uid, 'songs', id); }

// Search fallbacks when a specific link isn't saved
function ytLink(s)  { return s.youtube || 'https://www.youtube.com/results?search_query=' + encodeURIComponent(`${s.title} ${s.artist||''}`); }
function spLink(s)  { return s.spotify || 'https://open.spotify.com/search/' + encodeURIComponent(`${s.title} ${s.artist||''}`); }
function apLink(s)  { return s.apple   || 'https://music.apple.com/us/search?term=' + encodeURIComponent(`${s.title} ${s.artist||''}`); }

// ── Auth ──
document.getElementById('googleBtn').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); }
  catch (e) { toast('Sign-in failed: ' + (e.code || e.message)); }
});
document.getElementById('signoutBtn').addEventListener('click', () => signOut(auth));

onAuthStateChanged(auth, user => {
  currentUser = user;
  const signin = document.getElementById('signinScreen');
  const appWrap = document.getElementById('appWrap');
  const loading = document.getElementById('loading');
  const chip = document.getElementById('userChip');
  const signout = document.getElementById('signoutBtn');

  if (songsUnsub) { songsUnsub(); songsUnsub = null; }

  if (!user) {
    signin.classList.add('show');
    appWrap.style.display = 'none';
    loading.style.display = 'none';
    chip.innerHTML = '';
    signout.style.display = 'none';
    return;
  }

  signin.classList.remove('show');
  signout.style.display = '';
  chip.innerHTML = `${user.photoURL ? `<img src="${esc(user.photoURL)}" alt="">` : ''}<span class="uname">${esc(user.displayName || user.email)}</span>`;
  loading.style.display = 'block';
  appWrap.style.display = 'none';

  // Live library subscription
  songsUnsub = onSnapshot(query(songsCol(), orderBy('title')), snap => {
    songsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    loading.style.display = 'none';
    appWrap.style.display = 'block';
    renderLibrary();
  }, err => {
    loading.textContent = 'Could not load your library: ' + err.message;
  });
});

// ── Render ──
function renderLibrary() {
  const learning = songsCache.filter(s => s.status !== 'learned');
  const learned  = songsCache.filter(s => s.status === 'learned');
  renderSection('learningList', 'learningCount', learning, true);
  renderSection('learnedList', 'learnedCount', learned, false);
}

function renderSection(listId, countId, songs, isLearning) {
  const list = document.getElementById(listId);
  document.getElementById(countId).textContent = songs.length + (songs.length === 1 ? ' song' : ' songs');
  list.innerHTML = '';

  if (!songs.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-state';
    if (isLearning && songsCache.length === 0) {
      empty.innerHTML = `<div class="big">🎸</div><p>Your library is empty. Search for a song above to start —<br>or bring in the classic 44-song book.</p>
        <button class="btn" id="importBtn">Import 44 starter songs</button>`;
    } else {
      empty.innerHTML = isLearning
        ? `<p>Nothing in practice right now. Nice.</p>`
        : `<p>No songs marked as known yet. Tick the circle when you've got one down.</p>`;
    }
    list.appendChild(empty);
    const ib = empty.querySelector('#importBtn');
    if (ib) ib.addEventListener('click', importStarter);
    return;
  }

  songs.forEach(s => list.appendChild(songRow(s)));
}

function songRow(s) {
  const row = document.createElement('div');
  row.className = 'song-row' + (s.status === 'learned' ? ' done' : '');
  row.innerHTML = `
    <button class="learn-toggle ${s.status === 'learned' ? 'done' : ''}" title="Mark as ${s.status === 'learned' ? 'still learning' : 'known'}">${s.status === 'learned' ? '✓' : ''}</button>
    <div class="song-main">
      <div class="song-title">${esc(s.title)}</div>
      <div class="song-artist">${esc(s.artist || '—')}</div>
    </div>
    <input class="key-input" type="text" maxlength="4" placeholder="key" value="${esc(s.key || '')}" title="Key">
    <div class="link-icons">
      <a class="lnk yt" href="${esc(ytLink(s))}" target="_blank" title="YouTube">▶</a>
      <a class="lnk sp" href="${esc(spLink(s))}" target="_blank" title="Spotify">♫</a>
      <a class="lnk ap" href="${esc(apLink(s))}" target="_blank" title="Apple Music"></a>
    </div>
    <div class="row-actions">
      <a class="icon-btn detail" href="song.html?id=${encodeURIComponent(s.id)}" title="Open detail / notes">📖</a>
      <button class="icon-btn del" title="Remove">✕</button>
    </div>`;

  row.querySelector('.learn-toggle').addEventListener('click', () =>
    updateDoc(songDoc(s.id), { status: s.status === 'learned' ? 'learning' : 'learned', updatedAt: serverTimestamp() }));

  const keyInput = row.querySelector('.key-input');
  keyInput.addEventListener('change', () =>
    updateDoc(songDoc(s.id), { key: keyInput.value.trim(), updatedAt: serverTimestamp() }));

  row.querySelector('.del').addEventListener('click', () => {
    if (confirm(`Remove "${s.title}" from your library?`)) deleteDoc(songDoc(s.id));
  });

  return row;
}

// ── Add song (+ iTunes autocomplete) ──
const searchInput = document.getElementById('songSearch');
const suggestBox  = document.getElementById('suggestBox');
let searchTimer = null;
let suggestions = [];

searchInput.addEventListener('input', () => {
  const term = searchInput.value.trim();
  clearTimeout(searchTimer);
  if (term.length < 2) { hideSuggest(); return; }
  searchTimer = setTimeout(() => runSearch(term), 280);
});

searchInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    const term = searchInput.value.trim();
    if (term) addSong({ title: term });  // add exactly what was typed
  } else if (e.key === 'Escape') {
    hideSuggest();
  }
});

document.addEventListener('click', e => {
  if (!suggestBox.contains(e.target) && e.target !== searchInput) hideSuggest();
});

async function runSearch(term) {
  try {
    const res = await fetch('https://itunes.apple.com/search?media=music&entity=song&limit=7&term=' + encodeURIComponent(term));
    if (searchInput.value.trim() !== term) return; // stale
    const data = await res.json();
    suggestions = (data.results || []).map(r => ({
      title: r.trackName,
      artist: r.artistName,
      apple: r.trackViewUrl || '',
      artwork: (r.artworkUrl100 || '').replace('100x100', '100x100')
    }));
    showSuggest(term);
  } catch { suggestions = []; showSuggest(term); }  // API blocked → still offer manual add
}

function showSuggest(term) {
  suggestBox.innerHTML = '';
  suggestions.forEach(sg => {
    const item = document.createElement('div');
    item.className = 'suggest-item';
    item.innerHTML = `
      ${sg.artwork ? `<img src="${esc(sg.artwork)}" alt="">` : '<div style="width:34px;height:34px"></div>'}
      <div><div class="s-title">${esc(sg.title)}</div><div class="s-artist">${esc(sg.artist)}</div></div>`;
    item.addEventListener('click', () => addSong(sg));
    suggestBox.appendChild(item);
  });
  const manual = document.createElement('div');
  manual.className = 'suggest-item manual';
  manual.innerHTML = `＋ Add “${esc(term)}” as a new song`;
  manual.addEventListener('click', () => addSong({ title: term }));
  suggestBox.appendChild(manual);
  suggestBox.classList.add('show');
}
function hideSuggest() { suggestBox.classList.remove('show'); suggestBox.innerHTML = ''; }

async function addSong(data) {
  if (!currentUser || !data.title) return;
  const dup = songsCache.find(s => (s.title || '').toLowerCase() === data.title.toLowerCase()
    && (s.artist || '').toLowerCase() === (data.artist || '').toLowerCase());
  if (dup) { toast('Already in your library'); }
  else {
    await addDoc(songsCol(), {
      title: data.title,
      artist: data.artist || '',
      key: '',
      status: 'learning',
      youtube: '', spotify: '', apple: data.apple || '',
      songsterr: '', ug: '', tab1: '', tab2: '',
      tempo: '', structure: '', tricky: '', notes: '',
      artwork: data.artwork || '',
      mp3Url: '', mp3Path: '', mp3Name: '',
      perfs: [],
      createdAt: serverTimestamp(), updatedAt: serverTimestamp()
    });
    toast('Added to Learning');
  }
  searchInput.value = '';
  hideSuggest();
}
