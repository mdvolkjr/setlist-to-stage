<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Band Setlist Book</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Libre+Baskerville:ital@0;1&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --cream: #f5efe0; --parchment: #e8dcc8; --brown: #4a2e1a;
    --rust: #8b3a1a; --tan: #c8a97a; --ink: #2a1a0e;
    --faded: #7a6248; --line: #c4b08a; --green: #3a6b3a;
    --sidebar-w: 230px;
  }

  /* ── Layout ── */
  body {
    background-color: var(--cream);
    background-image: repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(196,176,138,0.22) 27px, rgba(196,176,138,0.22) 28px);
    font-family: 'Libre Baskerville', Georgia, serif;
    color: var(--ink); min-height: 100vh;
    display: flex;
  }

  /* ── Sidebar ── */
  .sidebar {
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--brown);
    display: flex;
    flex-direction: column;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    overflow-x: hidden;
    z-index: 10;
    border-right: 1px solid rgba(200,169,122,0.15);
  }
  .sidebar-top {
    padding: 20px 16px 16px;
    border-bottom: 1px solid rgba(200,169,122,0.15);
  }
  .sidebar-brand {
    font-family: 'Special Elite', cursive;
    font-size: 0.58rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--tan); opacity: 0.65; margin-bottom: 8px;
  }
  .band-name-input {
    width: 100%;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(200,169,122,0.25);
    border-radius: 3px; padding: 8px 10px;
    font-family: 'Playfair Display', serif; font-size: 1rem; font-weight: 700;
    color: var(--cream); outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  .band-name-input::placeholder { color: rgba(200,169,122,0.4); font-style: italic; font-weight: 400; }
  .band-name-input:focus { border-color: var(--tan); background: rgba(255,255,255,0.13); }

  .sidebar-section { padding: 14px 16px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sidebar-section-label {
    font-family: 'Special Elite', cursive; font-size: 0.58rem;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--tan); opacity: 0.6; margin-bottom: 2px;
  }
  .gig-list { display: flex; flex-direction: column; gap: 6px; }

  .gig-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(200,169,122,0.12);
    border-radius: 3px; padding: 10px 10px 10px 12px;
    cursor: pointer; transition: background 0.15s, border-color 0.15s;
  }
  .gig-item:hover { background: rgba(255,255,255,0.1); border-color: rgba(200,169,122,0.28); }
  .gig-item.active {
    background: rgba(139,58,26,0.3); border-color: var(--rust);
    box-shadow: inset 0 0 0 1px rgba(139,58,26,0.4);
  }
  .gig-item-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 4px; }
  .gig-name-text {
    font-family: 'Playfair Display', serif; font-size: 0.85rem;
    font-weight: 700; color: var(--cream); line-height: 1.25; flex: 1;
  }
  .gig-delete-btn {
    flex-shrink: 0; background: none; border: none;
    color: rgba(200,169,122,0.4); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 0 0 0 4px;
    transition: color 0.15s;
  }
  .gig-delete-btn:hover { color: #e07070; }
  .gig-meta { margin-top: 5px; display: flex; flex-direction: column; gap: 3px; }
  .gig-date-text { font-family: 'Special Elite', cursive; font-size: 0.68rem; color: var(--tan); opacity: 0.8; }
  .gig-days-badge {
    display: inline-block; font-family: 'Special Elite', cursive;
    font-size: 0.66rem; letter-spacing: 0.05em; padding: 1px 7px;
    border-radius: 2px; width: fit-content; margin-top: 2px;
  }
  .gig-days-badge.soon   { background: rgba(139,58,26,0.45); color: #f0c080; }
  .gig-days-badge.upcoming { background: rgba(58,107,58,0.3); color: #90c090; }
  .gig-days-badge.past   { background: rgba(80,60,40,0.3); color: rgba(200,169,122,0.5); }

  .add-gig-btn {
    width: 100%; background: rgba(255,255,255,0.04);
    border: 1px dashed rgba(200,169,122,0.25); border-radius: 3px;
    padding: 9px; font-family: 'Special Elite', cursive;
    font-size: 0.7rem; letter-spacing: 0.12em;
    color: var(--tan); opacity: 0.7; cursor: pointer;
    transition: opacity 0.15s, background 0.15s; text-align: center; margin-top: 2px;
  }
  .add-gig-btn:hover { opacity: 1; background: rgba(255,255,255,0.09); }

  .add-gig-form {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(200,169,122,0.22); border-radius: 3px;
    padding: 10px; display: flex; flex-direction: column; gap: 7px;
  }
  .gig-form-input {
    width: 100%; background: rgba(255,255,255,0.09);
    border: 1px solid rgba(200,169,122,0.28); border-radius: 3px;
    padding: 7px 8px; font-family: 'Libre Baskerville', serif;
    font-size: 0.76rem; color: var(--cream); outline: none;
  }
  .gig-form-input::placeholder { color: rgba(200,169,122,0.45); font-style: italic; }
  .gig-form-input:focus { border-color: var(--tan); }
  .gig-form-input[type="date"] { color-scheme: dark; }
  .gig-form-btns { display: flex; gap: 6px; }
  .gig-form-save {
    flex: 1; background: var(--rust); border: none; border-radius: 3px;
    padding: 7px; font-family: 'Special Elite', cursive; font-size: 0.7rem;
    letter-spacing: 0.1em; color: var(--cream); cursor: pointer; transition: background 0.15s;
  }
  .gig-form-save:hover { background: #a04020; }
  .gig-form-cancel {
    background: rgba(255,255,255,0.07); border: 1px solid rgba(200,169,122,0.2);
    border-radius: 3px; padding: 7px 10px; font-family: 'Special Elite', cursive;
    font-size: 0.7rem; color: var(--tan); cursor: pointer;
  }

  /* ── Main Content ── */
  .main-content { flex: 1; min-width: 0; padding: 40px 20px 80px; }

  /* Active gig banner */
  .gig-banner {
    display: none; align-items: center; gap: 14px;
    background: rgba(139,58,26,0.08); border: 1px solid rgba(139,58,26,0.18);
    border-radius: 3px; padding: 10px 18px;
    margin: 0 auto 28px; max-width: 1120px; width: 100%;
  }
  .gig-banner.show { display: flex; }
  .gig-banner-label {
    font-family: 'Special Elite', cursive; font-size: 0.6rem;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--faded); opacity: 0.8;
  }
  .gig-banner-name {
    font-family: 'Playfair Display', serif; font-size: 1.05rem;
    font-weight: 700; color: var(--brown);
  }
  .gig-banner-date { font-family: 'Special Elite', cursive; font-size: 0.76rem; color: var(--faded); }
  .gig-banner-days {
    margin-left: auto; font-family: 'Special Elite', cursive;
    font-size: 0.85rem; color: var(--rust); font-weight: bold; letter-spacing: 0.04em;
    white-space: nowrap;
  }

  header { text-align: center; margin-bottom: 40px; }
  header::before, header::after {
    content: ''; display: block; height: 2px;
    background: linear-gradient(to right, transparent, var(--rust), var(--tan), var(--rust), transparent);
    margin: 12px auto; width: 80%; max-width: 600px;
  }
  h1 { font-family: 'Special Elite', cursive; font-size: clamp(2rem,5vw,3.4rem); color: var(--brown); letter-spacing: 0.04em; text-shadow: 1px 1px 0 rgba(255,255,255,0.5); }
  .subtitle { font-family: 'Playfair Display', serif; font-style: italic; color: var(--faded); font-size: 1rem; margin-top: 6px; letter-spacing: 0.06em; }
  .ornament { text-align: center; color: var(--tan); font-size: 1.2rem; margin: 0 0 8px; letter-spacing: 0.3em; }

  .sets-container { display: flex; flex-direction: column; gap: 48px; max-width: 1120px; margin: 0 auto; }

  .set-card {
    background: var(--parchment); border: 1px solid var(--tan); border-radius: 2px;
    box-shadow: 3px 4px 18px rgba(74,46,26,0.13), inset 0 0 60px rgba(255,255,255,0.25);
    overflow: hidden; position: relative;
  }
  .set-card::before {
    content: ''; position: absolute; left: 46px; top: 0; bottom: 0;
    width: 1px; background: rgba(139,58,26,0.18); pointer-events: none; z-index: 0;
  }
  .set-header {
    background: var(--brown); padding: 14px 20px 14px 54px;
    display: flex; align-items: center; gap: 14px;
  }
  .set-number { font-family: 'Special Elite', cursive; color: var(--tan); font-size: 0.72rem; letter-spacing: 0.15em; text-transform: uppercase; opacity: 0.8; }
  .set-title { font-family: 'Playfair Display', serif; font-size: 1.25rem; color: var(--cream); font-weight: 700; }
  .legend { margin-left: auto; font-family: 'Special Elite', cursive; font-size: 0.62rem; color: var(--tan); letter-spacing: 0.08em; display: flex; align-items: center; gap: 6px; }
  .legend-check { width: 13px; height: 13px; background: var(--green); border-radius: 2px; display:inline-flex; align-items:center; justify-content:center; color:white; font-size:9px; }
  .set-count { font-family: 'Special Elite', cursive; color: var(--tan); font-size: 0.8rem; opacity: 0.7; }
  .playlist-btn { font-family: 'Special Elite', cursive; font-size: 0.65rem; letter-spacing: 0.08em; color: var(--cream); background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25); border-radius: 4px; padding: 4px 9px; cursor: pointer; transition: background 0.15s; text-decoration: none; white-space: nowrap; }
  .playlist-btn:hover { background: var(--rust); border-color: var(--rust); }

  table { width: 100%; border-collapse: collapse; }
  thead tr { border-bottom: 2px solid var(--line); }
  thead th {
    font-family: 'Special Elite', cursive; font-size: 0.62rem; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--faded); padding: 9px 7px 7px;
    text-align: left; background: rgba(200,169,122,0.15);
  }
  thead th.col-check  { width: 36px; text-align: center; padding-left: 12px; }
  thead th.col-num    { width: 26px; text-align: center; }
  thead th.col-song   { min-width: 150px; }
  thead th.col-artist { min-width: 120px; }
  thead th.col-key    { width: 60px; text-align: center; }
  thead th.col-yt     { width: 155px; }
  thead th.col-ug     { width: 145px; }
  thead th.col-actions { width: 72px; text-align: center; }

  tbody tr { border-bottom: 1px solid rgba(196,176,138,0.4); transition: background 0.15s; }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: rgba(255,255,255,0.3); }
  tbody tr.known { background: rgba(58,107,58,0.06); }
  tbody tr.known .song-name { text-decoration: line-through; color: var(--faded); opacity: 0.6; }

  td { padding: 9px 7px; vertical-align: middle; font-size: 0.87rem; }
  .check-cell { text-align: center; padding-left: 12px; }
  .know-check {
    appearance: none; -webkit-appearance: none;
    width: 18px; height: 18px; border: 2px solid var(--tan); border-radius: 3px;
    cursor: pointer; position: relative; background: rgba(255,255,255,0.5);
    transition: background 0.15s, border-color 0.15s; vertical-align: middle;
  }
  .know-check:checked { background: var(--green); border-color: var(--green); }
  .know-check:checked::after { content: '✓'; position: absolute; top: -2px; left: 2px; color: white; font-size: 13px; font-weight: bold; }

  .row-num { font-family: 'Special Elite', cursive; color: var(--faded); font-size: 0.7rem; display: block; text-align: center; }
  .song-name { font-family: 'Playfair Display', serif; font-weight: 700; color: var(--brown); font-size: 0.9rem; }
  .artist-name { font-size: 0.8rem; color: var(--faded); font-style: italic; }

  .link-cell { display: flex; align-items: center; gap: 4px; }
  .link-input {
    flex: 1; background: rgba(255,255,255,0.55); border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 6px; font-family: 'Libre Baskerville', serif;
    font-size: 0.68rem; color: var(--ink); outline: none;
    transition: border-color 0.2s, background 0.2s; min-width: 0;
  }
  .link-input:focus { border-color: var(--rust); background: #fff; }
  .link-input::placeholder { color: var(--tan); font-style: italic; }
  .go-btn {
    flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center;
    width: 23px; height: 23px; background: var(--rust); border: none; border-radius: 3px;
    cursor: pointer; color: var(--cream); text-decoration: none;
    transition: background 0.15s, transform 0.1s;
  }
  .go-btn:hover { background: var(--brown); transform: scale(1.1); }
  .go-btn.disabled { background: var(--line); pointer-events: none; }
  .go-btn svg { width: 10px; height: 10px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* Actions column: detail + row save */
  .actions-cell { text-align: center; white-space: nowrap; }
  .detail-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 29px; height: 28px; background: var(--brown); color: var(--cream);
    border-radius: 3px; text-decoration: none; font-size: 13px;
    transition: background 0.15s, transform 0.1s; cursor: pointer; border: none;
  }
  .detail-btn:hover { background: var(--rust); transform: scale(1.05); }

  .row-save-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 29px; height: 28px;
    background: rgba(58,107,58,0.1); border: 1px solid rgba(58,107,58,0.25);
    border-radius: 3px; cursor: pointer; font-size: 12px;
    margin-left: 3px; transition: background 0.15s, border-color 0.15s;
    color: var(--green);
    vertical-align: middle;
  }
  .row-save-btn:hover { background: rgba(58,107,58,0.22); border-color: rgba(58,107,58,0.45); }
  .row-save-btn.saved {
    background: var(--green); border-color: var(--green); color: white;
  }

  /* ── Floating Save ── */
  .float-save {
    position: fixed; bottom: 24px; right: 24px; z-index: 100;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .float-save-btn {
    width: 52px; height: 52px; background: var(--brown);
    border: 2px solid var(--tan); border-radius: 50%; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 2px 3px 14px rgba(74,46,26,0.45);
    transition: background 0.15s, transform 0.12s;
  }
  .float-save-btn:hover { background: var(--rust); transform: scale(1.08); }
  .float-save-btn.saved { background: var(--green); border-color: var(--green); }
  .float-save-label {
    font-family: 'Special Elite', cursive; font-size: 0.6rem;
    letter-spacing: 0.1em; text-transform: uppercase; color: var(--faded);
    opacity: 0; transition: opacity 0.3s;
  }
  .float-save-label.show { opacity: 1; }

  /* ── Bottom hint ── */
  .save-bar { text-align: center; margin-top: 48px; }
  .hint { font-family: 'Playfair Display', serif; font-style: italic; color: var(--faded); font-size: 0.74rem; text-align: center; margin-top: 10px; }

  /* ── Mobile sidebar toggle ── */
  .sidebar-toggle {
    display: none; position: fixed; top: 12px; left: 12px; z-index: 20;
    background: var(--brown); border: 1px solid var(--tan); border-radius: 3px;
    padding: 8px 11px; cursor: pointer; font-size: 16px; color: var(--cream);
    box-shadow: 1px 2px 8px rgba(74,46,26,0.3);
  }
  .sidebar-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 9;
  }
  .sidebar-overlay.show { display: block; }

  @media (max-width: 960px) {
    .sidebar {
      position: fixed; left: calc(-1 * var(--sidebar-w) - 2px);
      top: 0; bottom: 0; transition: left 0.25s ease;
    }
    .sidebar.open { left: 0; }
    .sidebar-toggle { display: flex; align-items: center; gap: 6px; font-family: 'Special Elite', cursive; font-size: 0.72rem; letter-spacing: 0.08em; }
    .main-content { padding-top: 58px; }
  }
  /* ── View toggle ── */
  .view-toggle { margin-top: 14px; display: flex; justify-content: center; gap: 6px; }
  .view-btn {
    font-family: 'Special Elite', cursive; font-size: 0.72rem; letter-spacing: 0.1em;
    text-transform: uppercase; padding: 6px 18px;
    background: rgba(74,46,26,0.07); border: 1px solid var(--tan);
    border-radius: 2px; color: var(--faded); cursor: pointer; transition: background 0.15s, color 0.15s;
  }
  .view-btn.active { background: var(--brown); color: var(--cream); border-color: var(--brown); }
  .view-btn:hover:not(.active) { background: rgba(74,46,26,0.14); }

  /* ── Mobile ── */
  @media (max-width: 960px) { .set-card { overflow-x: auto; } }
  @media (max-width: 760px) { thead th.col-ug, .col-ug-cell { display: none; } }
  @media (max-width: 560px) { thead th.col-artist, .col-artist-cell { display: none; } thead th.col-key, .col-key-cell { display: none; } }
  @media (max-width: 480px) { thead th.col-yt, .col-yt-cell { display: none; } }
</style>
</head>
<body>

<!-- Mobile sidebar toggle -->
<button class="sidebar-toggle" onclick="toggleSidebar()">☰ &nbsp;Band</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-top">
    <div class="sidebar-brand">Band</div>
    <input class="band-name-input" id="bandNameInput" placeholder="Enter band name…" maxlength="60">
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">Upcoming Gigs</div>
    <div class="gig-list" id="gigList"></div>
    <div id="addGigFormArea"></div>
    <button class="add-gig-btn" id="addGigBtn" onclick="showAddGigForm()">+ Add Gig</button>
  </div>
</aside>

<!-- Main content -->
<div class="main-content">
  <!-- Active gig banner -->
  <div class="gig-banner" id="gigBanner">
    <div>
      <div class="gig-banner-label">Performing at</div>
      <div class="gig-banner-name" id="gigBannerName"></div>
      <div class="gig-banner-date" id="gigBannerDate"></div>
    </div>
    <div class="gig-banner-days" id="gigBannerDays"></div>
  </div>

  <header>
    <div class="ornament">✦ ✦ ✦</div>
    <h1>The Setlist Book</h1>
    <p class="subtitle">Songs · Artists · Links · Tabs</p>
    <div class="view-toggle">
      <button class="view-btn active" id="viewBySet" onclick="setView('set')">By Set</button>
      <button class="view-btn" id="viewByArtist" onclick="setView('artist')">By Artist</button>
    </div>
  </header>

  <div class="sets-container" id="setsContainer"></div>

  <div class="save-bar">
    <div class="hint">✦ Click 📖 to open a song's full detail page &nbsp;·&nbsp; 💾 to save a row &nbsp;·&nbsp; ✓ = know it well</div>
  </div>
</div>

<!-- Floating save button -->
<div class="float-save">
  <button class="float-save-btn" id="floatSaveBtn" onclick="saveAll(true)" title="Save everything">💾</button>
  <div class="float-save-label" id="floatSaveLabel">Saved ✓</div>
</div>

<script type="module">
// ── Firebase Setup ────────────────────────────────────────────────────────────
// Uses Firebase v10 loaded from Google's CDN — no npm or build step needed.
import { initializeApp }                      from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
import { firebaseConfig }                     from './firebase-config.js';

const app      = initializeApp(firebaseConfig);
const db       = getFirestore(app);
// Everything lives in one Firestore document: collection "bandsetlist", doc "main"
// Fields: setlistData (map), gigs (array), bandName (string)
const DATA_DOC = doc(db, 'bandsetlist', 'main');

const YT          = 'https://www.youtube.com/watch?v=';
const STORAGE_KEY = 'bandsetlist_v3';   // localStorage keys used only as fallback
const GIGS_KEY    = 'bandsetlist_gigs';
const BAND_KEY    = 'bandsetlist_band';

const SETS = [
  { title: "Set One", songs: [
    { id:'s0i0', title:"Lonesome Me",                    artist:"Neil Young",        yt:YT+'EsA5tLr4_Pw' },
    { id:'s0i1', title:"Downhill",                       artist:"Sister Hazel",      yt:'' },
    { id:'s0i2', title:"Fireman",                        artist:"George Strait",     yt:YT+'PGdWmexwJok' },
    { id:'s0i3', title:"Dead Flowers",                   artist:"Rolling Stones",    yt:YT+'V3RLjuLWjUk' },
    { id:'s0i4', title:"Give Me a Ride",                 artist:"",                  yt:'' },
    { id:'s0i5', title:"Till I Hear It From You",        artist:"Gin Blossoms",      yt:YT+'o7sx32alzeE' },
    { id:'s0i6', title:"Can't Wait Anymore",             artist:"Sister Hazel",      yt:'' },
    { id:'s0i7', title:"Blame It on Your Heart",         artist:"Patty Loveless",    yt:YT+'qFf9E1B3RFM' },
    { id:'s0i8', title:"Turn It On",                     artist:"",                  yt:'' },
    { id:'s0i9', title:"Cryin, Waitin",                  artist:"Buddy Holly",       yt:YT+'qrUfGaGT8VQ' },
    { id:'s0i10',title:"To Be Real",                     artist:"",                  yt:'' },
    { id:'s0i11',title:"Jefferson Street",               artist:"",                  yt:'' },

// ── App state (cached in memory; loaded once from Firestore on startup) ────────
let appData     = {};  // flat key-value setlist map
let gigsArr     = [];  // gigs array
let bandNameStr = '';  // band name

// ── Cloud helpers ─────────────────────────────────────────────────────────────
async function saveToCloud(update) {
  // update is a partial object — merge: true leaves unrelated fields alone
  try {
    await setDoc(DATA_DOC, update, { merge: true });
  } catch (e) {
    console.warn('Firebase save failed — using localStorage as fallback:', e.message);
    if (update.setlistData !== undefined) localStorage.setItem(STORAGE_KEY, JSON.stringify(update.setlistData));
    if (update.gigs        !== undefined) localStorage.setItem(GIGS_KEY,    JSON.stringify(update.gigs));
    if (update.bandName    !== undefined) localStorage.setItem(BAND_KEY,    update.bandName);
  }
}

// ── Data accessors (synchronous after init loads everything) ──────────────────
function loadData()     { return appData; }
function loadGigs()     { return gigsArr; }
function loadBandName() { return bandNameStr; }

function saveGigs(g)    { gigsArr = g;    saveToCloud({ gigs: g }); }
function saveBandName(n){ bandNameStr = n; saveToCloud({ bandName: n }); }

// ── Date helpers ──
function daysUntil(dateStr) {
  const today = new Date(); today.setHours(0,0,0,0);
  const gig   = new Date(dateStr + 'T00:00:00');
  return Math.round((gig - today) / 86400000);
}
function formatDate(dateStr) {
  const d = new Date(dateStr + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' });
}
function daysBadge(days) {
  if (days < 0)   return { cls:'past',     text: Math.abs(days) + ' days ago' };
  if (days === 0) return { cls:'soon',     text: 'Tonight!' };
  if (days <= 14) return { cls:'soon',     text: days + ' day' + (days===1?'':'s') + ' away' };
  return               { cls:'upcoming',  text: days + ' days away' };
}

// ── Active gig ──
let activeGigId = null;

function selectGig(id) {
  activeGigId = (activeGigId === id) ? null : id; // toggle off if clicking same
  renderGigList();
  updateBanner();
}

function updateBanner() {
  const banner = document.getElementById('gigBanner');
  if (!activeGigId) { banner.classList.remove('show'); return; }
  const gigs = loadGigs();
  const gig  = gigs.find(g => g.id === activeGigId);
  if (!gig)  { banner.classList.remove('show'); return; }
  const days = daysUntil(gig.date);
  const badge = daysBadge(days);
  document.getElementById('gigBannerName').textContent = gig.name;
  document.getElementById('gigBannerDate').textContent = formatDate(gig.date);
  document.getElementById('gigBannerDays').textContent = badge.text;
  banner.classList.add('show');
}

// ── Gig list render ──
function renderGigList() {
  const gigs = loadGigs();
  const list = document.getElementById('gigList');
  list.innerHTML = '';
  gigs.forEach(gig => {
    const days  = daysUntil(gig.date);
    const badge = daysBadge(days);
    const div = document.createElement('div');
    div.className = 'gig-item' + (gig.id === activeGigId ? ' active' : '');
    div.innerHTML = `
      <div class="gig-item-header">
        <span class="gig-name-text">${esc(gig.name)}</span>
        <button class="gig-delete-btn" title="Remove gig">×</button>
      </div>
      <div class="gig-meta">
        <span class="gig-date-text">${formatDate(gig.date)}</span>
        <span class="gig-days-badge ${badge.cls}">${badge.text}</span>
      </div>`;
    div.querySelector('.gig-delete-btn').addEventListener('click', e => {
      e.stopPropagation();
      deleteGig(gig.id);
    });
    div.addEventListener('click', () => selectGig(gig.id));
    list.appendChild(div);
  });
}

function deleteGig(id) {
  let gigs = loadGigs().filter(g => g.id !== id);
  saveGigs(gigs);
  if (activeGigId === id) { activeGigId = null; updateBanner(); }
  renderGigList();
}

// ── Add gig form ──
// (exposed below after definition)
function showAddGigForm() {
  document.getElementById('addGigBtn').style.display = 'none';
  const area = document.getElementById('addGigFormArea');
  area.innerHTML = `
    <div class="add-gig-form">
      <input class="gig-form-input" id="newGigName" type="text" placeholder="Gig / venue name…" maxlength="60" autofocus>
      <input class="gig-form-input" id="newGigDate" type="date">
      <div class="gig-form-btns">
        <button class="gig-form-save" onclick="saveNewGig()">Save Gig</button>
        <button class="gig-form-cancel" onclick="hideAddGigForm()">Cancel</button>
      </div>
    </div>`;
  const inp = area.querySelector('#newGigName');
  inp.focus();
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('newGigDate').focus(); });
  area.querySelector('#newGigDate').addEventListener('keydown', e => { if (e.key === 'Enter') saveNewGig(); });
}

function hideAddGigForm() {
  document.getElementById('addGigFormArea').innerHTML = '';
  document.getElementById('addGigBtn').style.display = '';
}

function saveNewGig() {
  const name = document.getElementById('newGigName').value.trim();
  const date = document.getElementById('newGigDate').value;
  if (!name || !date) return;
  const gigs = loadGigs();
  gigs.push({ id: 'gig_' + Date.now(), name, date });
  gigs.sort((a,b) => a.date.localeCompare(b.date));
  saveGigs(gigs);
  hideAddGigForm();
  renderGigList();
}

// ── Band name ──
function initBandName() {
  const inp = document.getElementById('bandNameInput');
  inp.value = loadBandName();
  inp.addEventListener('input', () => saveBandName(inp.value.trim()));
}

// ── Save all setlist data ──
function saveAll(fromFloat) {
  // Merge DOM values into appData (preserving song-detail keys like notes, songsterr, etc.)
  document.querySelectorAll('[data-key]').forEach(el => {
    if (el.type === 'checkbox') {
      appData[el.dataset.key] = el.checked; // always save true/false explicitly
    } else {
      const val = el.value.trim();
      if (val !== '') appData[el.dataset.key] = val;
      else delete appData[el.dataset.key];
    }
  });
  saveToCloud({ setlistData: appData });

  if (fromFloat) {
    const btn   = document.getElementById('floatSaveBtn');
    const label = document.getElementById('floatSaveLabel');
    btn.classList.add('saved');
    label.classList.add('show');
    setTimeout(() => { btn.classList.remove('saved'); label.classList.remove('show'); }, 2000);
  }
}
window.saveAll = saveAll; // expose for inline onclick

// ── Per-row save ──
function flashRowSave(btn) {
  saveAll(false);
  btn.classList.add('saved');
  btn.textContent = '✓';
  setTimeout(() => { btn.classList.remove('saved'); btn.textContent = '💾'; }, 1800);
}

function updateGoBtn(input) {
  const btn = input.parentElement.querySelector('.go-btn');
  if (!btn) return;
  const val = input.value.trim();
  if (val) { btn.classList.remove('disabled'); btn.href = val.startsWith('http') ? val : 'https://' + val; btn.target = '_blank'; }
  else { btn.classList.add('disabled'); btn.removeAttribute('href'); btn.removeAttribute('target'); }
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── View state ──
let currentView = 'set';

function setView(view) {
  currentView = view;
  document.getElementById('viewBySet').classList.toggle('active', view === 'set');
  document.getElementById('viewByArtist').classList.toggle('active', view === 'artist');
  render();
}
window.setView = setView;

// ── Build a song row (shared by both views) ──
function buildRow(song, rowNum, saved) {
  const kk = t => `${song.id}_${t}`;
  const isKnown   = saved[kk('known')] === true || saved[kk('known')] === 'true';
  const artistVal = kk('artist') in saved ? saved[kk('artist')] : (song.artist || '');
  const ytVal     = kk('yt') in saved ? saved[kk('yt')] : (song.yt || '');
  const ugVal     = saved[kk('ug')]  || '';
  const keyVal    = saved[kk('key')] || '';

  const tr = document.createElement('tr');
  if (isKnown) tr.classList.add('known');
  tr.innerHTML = `
    <td class="check-cell"><input type="checkbox" class="know-check" data-key="${kk('known')}" ${isKnown ? 'checked' : ''}></td>
    <td><span class="row-num">${rowNum}</span></td>
    <td><span class="song-name">${esc(song.title)}</span></td>
    <td class="col-artist-cell">
      <input class="link-input" type="text" placeholder="Artist…" data-key="${kk('artist')}" value="${esc(artistVal)}" style="width:100%">
    </td>
    <td class="col-key-cell" style="text-align:center">
      <input class="link-input key-input" type="text" maxlength="4" placeholder="–" data-key="${kk('key')}" value="${esc(keyVal)}" style="width:46px;text-align:center;font-family:'Special Elite',cursive;font-size:0.8rem;">
    </td>
    <td class="col-yt-cell">
      <div class="link-cell">
        <input class="link-input" type="url" placeholder="YouTube URL…" data-key="${kk('yt')}" value="${esc(ytVal)}">
        <a class="go-btn ${ytVal ? '' : 'disabled'}" ${ytVal ? `href="${esc(ytVal)}" target="_blank"` : ''}><svg viewBox="0 0 10 10"><path d="M1 5h8M5.5 1.5 9 5l-3.5 3.5"/></svg></a>
      </div>
    </td>
    <td class="col-ug-cell">
      <div class="link-cell">
        <input class="link-input" type="url" placeholder="UG URL…" data-key="${kk('ug')}" value="${esc(ugVal)}">
        <a class="go-btn ${ugVal ? '' : 'disabled'}" ${ugVal ? `href="${esc(ugVal)}" target="_blank"` : ''}><svg viewBox="0 0 10 10"><path d="M1 5h8M5.5 1.5 9 5l-3.5 3.5"/></svg></a>
      </div>
    </td>
    <td class="actions-cell">
      <a class="detail-btn" href="song.html?id=${song.id}" title="Open song detail">📖</a><button class="row-save-btn" title="Save this row">💾</button>
    </td>`;

  tr.querySelector('.know-check').addEventListener('change', function() {
    if (this.checked) tr.classList.add('known'); else tr.classList.remove('known');
    saveAll(false);
  });
  tr.querySelectorAll('.link-input').forEach(inp => {
    inp.addEventListener('input',  () => updateGoBtn(inp));
    inp.addEventListener('change', () => saveAll(false));
  });
  tr.querySelector('.row-save-btn').addEventListener('click', function() { flashRowSave(this); });
  return tr;
}

function tableHeader(extraCol = '') {
  return `<thead><tr>
    <th class="col-check">✓</th>
    <th class="col-num">#</th>
    <th class="col-song">Song</th>
    <th class="col-artist">Artist</th>
    <th class="col-key">Key</th>
    <th class="col-yt">▶ YouTube</th>
    <th class="col-ug">🎸 Ult. Guitar</th>
    ${extraCol}
    <th class="col-actions">📖 💾</th>
  </tr></thead>`;
}

// ── YouTube playlist helper ──
function ytIdFromUrl(url) {
  const m = (url || '').match(/(?:v=|youtu\.be\/)([A-Za-z0-9_-]{11})/);
  return m ? m[1] : null;
}

function makePlaylist(setIndex) {
  const saved = loadData();
  const songs = SETS[setIndex].songs;
  const ids = songs.map(song => {
    const ytVal = `${song.id}_yt` in saved ? saved[`${song.id}_yt`] : (song.yt || '');
    return ytIdFromUrl(ytVal);
  }).filter(Boolean);
  if (!ids.length) { alert('No YouTube links found for this set.'); return; }
  window.open('https://www.youtube.com/watch_videos?video_ids=' + ids.join(','), '_blank');
}
window.makePlaylist = makePlaylist;

// ── Render setlists ──
function render() {
  const saved = loadData();
  const container = document.getElementById('setsContainer');
  container.innerHTML = '';

  if (currentView === 'artist') {
    // Flat list of all songs sorted alphabetically by artist
    const allSongs = [];
    SETS.forEach((set, si) => set.songs.forEach(song => allSongs.push({ song, setLabel: set.title })));
    allSongs.sort((a, b) => {
      const kk = s => `${s.id}_artist`;
      const artistA = (saved[kk(a.song)] || a.song.artist || '').toLowerCase();
      const artistB = (saved[kk(b.song)] || b.song.artist || '').toLowerCase();
      if (!artistA && !artistB) return 0;
      if (!artistA) return 1;
      if (!artistB) return -1;
      return artistA.localeCompare(artistB);
    });

    const card = document.createElement('div');
    card.className = 'set-card';
    card.innerHTML = `
      <div class="set-header">
        <span class="set-title">All Songs — A to Z by Artist</span>
        <span class="set-count">${allSongs.length} songs</span>
      </div>
      <table>${tableHeader()}</table>`;
    const tbody = document.createElement('tbody');
    card.querySelector('table').appendChild(tbody);
    container.appendChild(card);
    allSongs.forEach(({ song }, i) => tbody.appendChild(buildRow(song, i + 1, saved)));

  } else {
    // Default: one card per set
    SETS.forEach((set, si) => {
      const card = document.createElement('div');
      card.className = 'set-card';
      card.innerHTML = `
        <div class="set-header">
          <span class="set-number">Set ${si + 1}</span>
          <span class="set-title">${set.title}</span>
          <div class="legend"><span class="legend-check">✓</span> = know it well</div>
          <button class="playlist-btn" onclick="makePlaylist(${si})" title="Open all YouTube links as a playlist">▶ YouTube Playlist</button>
          <span class="set-count">${set.songs.length} songs</span>
        </div>
        <table>${tableHeader()}</table>`;
      const tbody = document.createElement('tbody');
      card.querySelector('table').appendChild(tbody);
      container.appendChild(card);
      set.songs.forEach((song, i) => tbody.appendChild(buildRow(song, i + 1, saved)));
    });
  }
}

// ── Mobile sidebar ──
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebarOverlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebarOverlay').classList.remove('show');
}

// Expose all functions used in inline onclick attributes
window.showAddGigForm  = showAddGigForm;
window.hideAddGigForm  = hideAddGigForm;
window.saveNewGig      = saveNewGig;
window.toggleSidebar   = toggleSidebar;
window.closeSidebar    = closeSidebar;

// ── Init ──
// Load all data from Firestore first, then render the UI.
async function init() {
  try {
    const snap = await getDoc(DATA_DOC);
    if (snap.exists()) {
      const d  = snap.data();
      appData     = d.setlistData || {};
      gigsArr     = d.gigs        || [];
      bandNameStr = d.bandName    || '';
    } else {
      // Nothing in Firestore yet — check localStorage for any existing data to migrate
      try { appData     = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}
      try { gigsArr     = JSON.parse(localStorage.getItem(GIGS_KEY))    || []; } catch {}
      bandNameStr = localStorage.getItem(BAND_KEY) || '';
    }
  } catch (e) {
    // Firebase not configured yet (placeholder config) — fall back to localStorage silently
    console.warn('Firebase load failed — using localStorage as fallback:', e.message);
    try { appData     = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}
    try { gigsArr     = JSON.parse(localStorage.getItem(GIGS_KEY))    || []; } catch {}
    bandNameStr = localStorage.getItem(BAND_KEY) || '';
  }
  initBandName();
  renderGigList();
  render();
}

init();
</script>
